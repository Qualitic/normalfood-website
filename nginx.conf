server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    location / {
        try_files $uri/index.html $uri.html $uri =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
